openapi: 3.0.2
info:
  title: NeuVue Queue REST API
  description: NeuVue Queue REST API documentation.
  version: 0.4.0

# OnComplete function in index.html will figure out which server should be displayed here
servers:
  - url: https://queue.neuvue.io/
    description: Main development server.
  - url: http://localhost/
    description: Local development server.

components:
  parameters:
    pageParam:
      in: query
      name: p
      schema:
        type: integer
        minimum: 0
        default: 0
      required: false
      description: Current page.
    pageSizeParam:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        default: 100
      required: false
      description: Set the number of items returned per page.
    populateParam:
      in: query
      name: populate
      schema:
        type: string
      required: false
      description: >
        Replace the document id in the provided field in each object with its corresponding document.
        To populate multiple fields per object, pass a string containing each field separated by a comma.
    queryParam:
      in: query
      name: q
      schema:
        type: object
      required: false
      description: Query object as JSON. Supports MongoDB statements.
    selectParam:
      in: query
      name: select
      schema:
        type: string
      required: false
      description: >
        Select a subset of fields in each object. To select multiple fields per object,
        pass a string containing each field separated by a comma.
    sortParam:
      in: query
      name: sort
      schema:
        type: string
      required: false
      description:
        Fields to sort on. To sort on multiple fields, pass a string containing
        each sort statement separated by a command.

  responses:
    Forbidden:
      description: Prohibited from accessing the specified resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: prohibited user, or missing a whitelisted audience and/or role

    NotFound:
      description: The specified resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: not found
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: missing access token
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 500
            message: internal server error

  schemas:
    Point:
      type: object
      properties:
        _id:
          type: string
        active:
          type: boolean
        author:
          type: string
        coordinate:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
        resolution:
          type: number
        created:
          type: integer
          minimum: 0
        metadata:
          type: object
        namespace:
          type: string
        submitted:
          type: integer
          minimum: 0
        type:
          type: string
      required:
        - author
        - coordinate
        - created
        - namespace
        - type
    Auth:
      type: object
      properties:
        _id:
          type: string
        active:
          type: boolean
        submitted:
          type: integer
        code:
          type: string
      required:
        - code
    AdaptivePriority:
      type: object
      description: >
        Optional adaptive priority configuration and provenance. When enabled,
        the queue computes scalar task priority from priors using weighted_sum_v1.
      properties:
        enabled:
          type: boolean
          default: false
        strategy:
          type: string
          enum:
            - weighted_sum_v1
          default: weighted_sum_v1
        priors:
          type: object
          description: Numeric or string-valued priority inputs keyed by prior name.
          additionalProperties:
            oneOf:
              - type: number
              - type: string
        weights:
          type: object
          description: Numeric weights keyed by prior name. Missing weights default to 1.
          additionalProperties:
            type: number
        categories:
          type: object
          description: Numeric lookup tables for string-valued categorical priors.
          additionalProperties:
            type: object
            additionalProperties:
              type: number
        bias:
          type: number
          default: 0
        min:
          type: number
          default: 0
        max:
          nullable: true
          type: number
          default: null
        score:
          nullable: true
          type: number
          description: Last computed effective adaptive score.
        contributions:
          type: object
          description: Per-prior numeric contribution from the last computation.
          additionalProperties:
            type: number
        provenance:
          type: object
          description: Pass-through source, version, reason, or client metadata.
        updated:
          nullable: true
          type: integer
          description: Epoch timestamp of the last adaptive recompute.
      example:
        enabled: true
        strategy: weighted_sum_v1
        priors:
          uncertainty: 0.8
          category: merger
        weights:
          uncertainty: 10
          category: 1
        categories:
          category:
            merger: 5
            split: 2
        bias: 1
        min: 0
        max: null
        provenance:
          source: python-tool
          version: v1
    Task:
      type: object
      properties:
        _id:
          type: string
        active:
          type: boolean
        assignee:
          type: string
        author:
          type: string
        closed:
          type: integer
          minimum: 0
        created:
          type: integer
          minimum: 0
        instructions:
          type: object
        metadata:
          type: object
        namespace:
          type: string
        opened:
          type: integer
          minimum: 0
        priority:
          type: number
          minimum: 0
        adaptive_priority:
          $ref: '#/components/schemas/AdaptivePriority'
        duration:
          type: number
          minimum: 0
        status:
          type: string
          enum:
            - completed
            - errored
            - open
            - pending
        seg_id:
          type: string
        ng_state:
          type: string
        points:
          type: array
          items: 
            type: string
          minItems: 0
        tags:
          type: array
          items: 
            type: string
          minItems: 0
      required:
        - assignee
        - author
        - instructions
        - namespace
        - priority
    Differ Stack:
      type: object
      properties:
        _id:
          type: string
        active:
          type: boolean
        task_id:
          type: string
        differ_stack:
          type: array
          items: 
            type: object
          minItems: 0
      required:
        - task_id
        - differ_stack
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
      required:
        - code
        - message

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []    

paths:  
  /points:
    get:
      tags:
        - Points
      summary: Get paginated list of Points.
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/queryParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - $ref: '#/components/parameters/populateParam'
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/sortParam'
      responses:
        '200':
          description: A JSON array of Point objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
        '400':
          description: Bad request. The query param q must be a valid JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Points
      summary: Creates one or more Points.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Point'
      responses:
        '201':
          description: Created. A JSON array of Point objects with IDs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
        '400':
          description: Bad request. One or more of the Point objects are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /points/{pointId}:
    parameters:
      - name: pointId
        in: path
        required: true
        description: Point ID.
        schema:
          type: string
    delete:
      tags:
        - Points
      summary: Deactivates a Point by ID.
      responses:
        '204':
          description: The Point has been deactivated.
        '400':
          description: Bad request. The ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Points
      summary: Returns a point by ID.
      responses:
        '200':
          description: A point object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Point'
        '400':
          description: Bad request. The ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth:
    get:
      tags:
        - Auth
      summary: Endpoint for receiving access tokens
      parameters:
        - $ref: '#/components/parameters/queryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - $ref: '#/components/parameters/populateParam'
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/sortParam'
      responses:
        '200':
          description: An access token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auth'
        '400':
          description: Bad request. The query param q must be a valid JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Auth
      summary: Submits a authorization token for validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Point'
      responses:
        '201':
          description: Created. A JSON array of Point objects with IDs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
        '400':
          description: Bad request. One or more of the Point objects are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/{authID}:
    parameters:
      - name: authId
        in: path
        required: true
        description: auth ID.
        schema:
          type: string
    delete:
      tags:
        - Auth
      summary: Deletes a auth ID
      responses:
        '204':
          description: The auth has been deactivated.
        '400':
          description: Bad request. The ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Auth
      summary: Returns a auth by ID.
      responses:
        '200':
          description: A auth object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
        '400':
          description: Bad request. The ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'  
  /tasks:
    get:
      tags:
        - Tasks
      summary: Get paginated list of tasks.
      description: >
        Higher priority values should be served first. Adaptive queues can be queried with
        q={"status":"pending","active":true} and sort=-priority. Adaptive-only queues can
        add q={"adaptive_priority.enabled":true}.
      parameters:
        - $ref: '#/components/parameters/queryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - $ref: '#/components/parameters/populateParam'
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/sortParam'
      responses:
        '200':
          description: A JSON array of task objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          description: Bad request. The query param q must be a valid JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Tasks
      summary: Creates one or more tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Task'
      responses:
        '201':
          description: Created. A JSON array of task objects with IDs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          description: Bad request. One or more of the task objects are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        description: task ID.
        schema:
          type: string
    delete:
      tags:
        - Tasks
      summary: Deactivates a task by ID.
      responses:
        '204':
          description: The task has been deactivated.
        '400':
          description: Bad request. The ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Tasks
      summary: Returns a task by ID.
      responses:
        '200':
          description: A task object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request. The ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskId}/instructions:
    patch:
      tags:
        - Tasks
      summary: Set the instructions of a task
      parameters:
        - name: taskId
          in: path
          required: true
          description: task ID.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The instructions have been changed. Returns the previous task object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request. The ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskId}/priority:
    patch:
      tags:
        - Tasks
      summary: Set the priority of a task
      description: >
        This endpoint remains backward compatible and updates only the scalar priority.
        It does not clear adaptive_priority; a later adaptive_priority patch can recompute
        and overwrite the scalar priority.
      parameters:
        - name: taskId
          in: path
          required: true
          description: task ID.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                priority:
                  type: number
                  minimum: 0
      responses:
        '200':
          description: The priority has been changed. Returns the previous task object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request. The ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskId}/adaptive_priority:
    patch:
      tags:
        - Tasks
      summary: Patch adaptive priority inputs and recompute task priority
      description: >
        Shallowly merges priors, weights, categories, and provenance into the existing
        adaptive_priority object. Replaces scalar adaptive config fields such as enabled,
        bias, min, and max. If adaptive priority is enabled after the patch, the server
        recomputes adaptive_priority.score, adaptive_priority.contributions,
        adaptive_priority.updated, and the scalar task priority.
      parameters:
        - name: taskId
          in: path
          required: true
          description: task ID.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdaptivePriority'
            examples:
              numeric:
                summary: Numeric priors
                value:
                  enabled: true
                  priors:
                    uncertainty: 0.8
                    age_hours: 4
                  weights:
                    uncertainty: 10
                    age_hours: 0.5
                  provenance:
                    source: python-tool
              categorical:
                summary: Categorical prior
                value:
                  enabled: true
                  priors:
                    category: merger
                  categories:
                    category:
                      merger: 5
                      split: 2
                  weights:
                    category: 1
      responses:
        '200':
          description: Adaptive priority has been changed. Returns the previous task object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request. The adaptive priority object is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskId}/duration:
    patch:
      tags:
        - Tasks
      summary: Set the duration of a task
      parameters:
        - name: taskId
          in: path
          required: true
          description: task ID.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                duration:
                  type: number
                  minimum: 0
      responses:
        '200':
          description: The duration has been changed. Returns the previous task object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request. The ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskId}/status:
    patch:
      tags:
        - Tasks
      summary: Set the status of a task
      parameters:
        - name: taskId
          in: path
          required: true
          description: task ID.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - complete
                    - errored
                    - open
                    - pending
      responses:
        '200':
          description: The status has been changed. Returns the previous task object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request. The ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskId}/tags:
      patch:
        tags:
          - Tasks
        summary: Set the tags of a task
        parameters:
          - name: taskId
            in: path
            required: true
            description: task ID.
            schema:
              type: string
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items: 
                      type: string
        responses:
          '200':
            description: The tags have been changed. Returns the previous task object.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Task'
          '400':
            description: Bad request. The ID is invalid.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'
  /differstacks:
    get:
      tags:
        - Differ Stacks
      summary: Get all differ stacks 
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/queryParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - $ref: '#/components/parameters/populateParam'
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/sortParam'
      responses:
        '200':
          description: A JSON array of differ stack objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Differ Stack'
        '400':
          description: Bad request. The query param q must be a valid JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Differ Stacks
      summary: Creates one or more differ stacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
